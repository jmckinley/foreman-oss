  - slug: acmeweb
    repo: acme-demo/acmeweb
    default_branch: main
    worktree:
      mbp: /srv/acme-demo/acmeweb
    tier_default: local
    cadences: [docs-sync, quality-review, security-review]
    escalation:
      github_issues: false

  - slug: filingsvc
